apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moodle-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moodle
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: moodle
    spec:
      containers:
      - name: moodle
        image: ndcuongdevops/moodle-lms:latest
        ports:
        - containerPort: 80
        env:
        - name: MOODLE_DB_TYPE
          value: "pgsql"
        - name: MOODLE_DB_HOST
          value: "${MOODLE_DB_HOST}"
        - name: MOODLE_DB_NAME
          value: "moodle"
        - name: MOODLE_DB_USER
          value: "${MOODLE_DB_USER}"
        - name: MOODLE_DB_PASSWORD
          value: "${MOODLE_DB_PASSWORD}"
        - name: MOODLE_DB_PORT
          value: "${MOODLE_DB_PORT}"
        - name: MOODLE_DB_SSLMODE
          value: "require"
        - name: MOODLE_WWWROOT
          value: "${MOODLE_WWWROOT}"
        - name: MOODLE_SSL_PROXY
          value: "true"
        volumeMounts:
        - name: moodle-data-volume
          mountPath: /var/www/moodledata
        readinessProbe:
          httpGet:
            path: /login/index.php
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: moodle-data-volume
        persistentVolumeClaim:
          claimName: moodle-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: moodle-service
spec:
  selector:
    app: moodle
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
