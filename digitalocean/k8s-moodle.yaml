---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-rwx
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  fsType: "ext4"
  nfsOptions: "vers=4.2,noresvport,softerr,timeo=600,retrans=5"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moodle-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-rwx
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moodle
  template:
    metadata:
      labels:
        app: moodle
    spec:
      # Không dùng runAsUser 33 (www-data): Apache cần bind port 80 (privileged), Longhorn không root squashing.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - moodle
                topologyKey: kubernetes.io/hostname
      containers:
      - name: moodle
        image: ndcuongdevops/moodle-lms:v1.0.6
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "400m"
            memory: "800Mi"
          limits:
            cpu: "1200m"
            memory: "1800Mi"
        env:
        - name: MOODLE_DB_HOST
          value: "REPLACE_WITH_DO_DB_HOST"
        - name: MOODLE_DB_NAME
          value: "moodle"
        - name: MOODLE_DB_USER
          value: "moodleuser"
        - name: MOODLE_DB_PASSWORD
          value: "REPLACE_WITH_DB_PASSWORD"
        volumeMounts:
        - name: moodle-data-volume
          mountPath: /var/www/moodledata
        - name: moodle-config
          mountPath: /var/www/html/config.php
          subPath: config.php
          readOnly: true
      volumes:
      - name: moodle-data-volume
        persistentVolumeClaim:
          claimName: moodle-data-pvc
      - name: moodle-config
        configMap:
          name: moodle-config
---
apiVersion: v1
kind: Service
metadata:
  name: moodle-service
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: DO_LOADBALANCER_NAME_PLACEHOLDER
    external-dns.alpha.kubernetes.io/hostname: EXTERNAL_DNS_HOSTNAME_PLACEHOLDER
spec:
  selector:
    app: moodle
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
