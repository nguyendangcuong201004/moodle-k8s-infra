apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-synthetic-probe-script
  namespace: monitoring
data:
  k6-synthetic-probe.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    const BASE_URL = __ENV.BASE_URL || '';
    const MAX_REDIRECTS = Number(__ENV.MAX_REDIRECTS || 5);
    const HTTP_TIMEOUT = __ENV.HTTP_TIMEOUT || '12s';

    export const options = {
      scenarios: {
        probe: {
          executor: 'constant-vus',
          vus: 1,
          duration: __ENV.PROBE_DURATION || '24h',
          gracefulStop: '0s',
        },
      },
      thresholds: {},
    };

    function isOkOrRedirect(status) {
      return status === 200 || status === 301 || status === 302 || status === 303;
    }

    export default function () {
      if (!BASE_URL) {
        throw new Error('BASE_URL is required');
      }

      const common = {
        redirects: MAX_REDIRECTS,
        timeout: HTTP_TIMEOUT,
        tags: { testid: 'moodle-synthetic' },
      };

      const home = http.get(`${BASE_URL}/`, {
        ...common,
        tags: { ...common.tags, name: 'home' },
      });
      check(home, {
        'home status 2xx/3xx': (r) => isOkOrRedirect(r.status),
      });

      const login = http.get(`${BASE_URL}/login/index.php`, {
        ...common,
        tags: { ...common.tags, name: 'login' },
      });
      check(login, {
        'login status 2xx/3xx': (r) => isOkOrRedirect(r.status),
      });

      sleep(5);
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-synthetic-probe
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6-synthetic-probe
  template:
    metadata:
      labels:
        app: k6-synthetic-probe
    spec:
      containers:
        - name: k6
          image: grafana/k6:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              exec k6 run \
                -o experimental-prometheus-rw \
                --tag testid=TEST_ID_PLACEHOLDER \
                /scripts/k6-synthetic-probe.js
          env:
            - name: BASE_URL
              value: BASE_URL_PLACEHOLDER
            - name: MAX_REDIRECTS
              value: "5"
            - name: HTTP_TIMEOUT
              value: "12s"
            - name: PROBE_DURATION
              value: "24h"
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: PROM_RW_URL_PLACEHOLDER
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: p(95),p(99),avg,min,max
            - name: K6_PROMETHEUS_RW_STALE_MARKERS
              value: "true"
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-synthetic-probe-script
            items:
              - key: k6-synthetic-probe.js
                path: k6-synthetic-probe.js