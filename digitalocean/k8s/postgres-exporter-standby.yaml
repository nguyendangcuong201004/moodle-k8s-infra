---
# Optional: scrape the standby / read replica (same DB name; doadmin from step_postgres_exporter).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter-standby
  namespace: monitoring
  labels:
    app.kubernetes.io/name: postgres-exporter-standby
    app.kubernetes.io/part-of: moodle-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter-standby
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter-standby
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          args:
            - --web.telemetry-path=/metrics
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-standby-credentials
                  key: DATA_SOURCE_NAME
            - name: PG_EXPORTER_EXCLUDE_DATABASES
              value: "template0,template1,defaultdb,_dodb"
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter-standby
  namespace: monitoring
  labels:
    app.kubernetes.io/name: postgres-exporter-standby
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-exporter-standby
  ports:
    - name: metrics
      port: 9188
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter-standby
  namespace: monitoring
  labels:
    app.kubernetes.io/name: postgres-exporter-standby
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter-standby
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 15s
      relabelings:
        - targetLabel: component
          replacement: postgres-standby
