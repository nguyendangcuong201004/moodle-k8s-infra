---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-rwx
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  fsType: "ext4"
  nfsOptions: "vers=4.2,noresvport,softerr,timeo=600,retrans=5"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moodle-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-rwx
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moodle
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: moodle
    spec:
      # Không dùng runAsUser 33 (www-data): Apache cần bind port 80 (privileged), Longhorn không root squashing.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - moodle
                topologyKey: kubernetes.io/hostname
      containers:
      - name: moodle
        image: ndcuongdevops/moodle-lms:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "400m"
            memory: "800Mi"
          limits:
            cpu: "1200m"
            memory: "1800Mi"
        env:
        - name: MOODLE_DB_TYPE
          value: "pgsql"
        - name: MOODLE_DB_HOST
          value: "${MOODLE_DB_HOST}"
        - name: MOODLE_DB_NAME
          value: "moodle"
        - name: MOODLE_DB_USER
          value: "${MOODLE_DB_USER}"
        - name: MOODLE_DB_PASSWORD
          value: "${MOODLE_DB_PASSWORD}"
        - name: MOODLE_DB_PORT
          value: "${MOODLE_DB_PORT}"
        - name: MOODLE_DB_SSLMODE
          value: "require"
        - name: MOODLE_WWWROOT
          value: "${MOODLE_WWWROOT}"
        - name: MOODLE_SSL_PROXY
          value: "true"
        volumeMounts:
        - name: moodle-data-volume
          mountPath: /var/www/moodledata
        readinessProbe:
          httpGet:
            path: /login/index.php
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: moodle-data-volume
        persistentVolumeClaim:
          claimName: moodle-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: moodle-service
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: "${DO_LOADBALANCER_NAME}"
    external-dns.alpha.kubernetes.io/hostname: "${EXTERNAL_DNS_HOSTNAME}"
spec:
  selector:
    app: moodle
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
