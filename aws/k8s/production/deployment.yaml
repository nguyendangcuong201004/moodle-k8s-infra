apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle
  namespace: moodle-production
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: moodle
      env: production
  template:
    metadata:
      labels:
        app: moodle
        env: production
    spec:
      containers:
      - name: moodle
        image: ndcuongdevops/moodle-lms:${MOODLE_IMAGE_TAG:-latest}
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: moodle-env
        - secretRef:
            name: moodle-secret
        volumeMounts:
        - name: moodle-data-volume
          mountPath: /var/www/moodledata
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /login/index.php
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /login/index.php
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: moodle-data-volume
        persistentVolumeClaim:
          claimName: moodle-efs-pvc
