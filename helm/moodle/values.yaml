# HCMUT Moodle LMS - Default Helm Values
# Override per cloud via setup.sh --set flags or custom values files.

replicaCount: 6

image:
  repository: ndcuongdevops/moodle-lms
  tag: staging
  pullPolicy: IfNotPresent

# Nginx sidecar: HTTP on :80 → PHP-FPM :9000 (required when image is php-fpm, not apache)
nginx:
  image:
    repository: nginx
    tag: "1.25-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
phpFpm:
  env:
    OPCACHE_MEMORY: "512"
    FPM_PM_CONTROL: "dynamic"
    FPM_MAX_CHILDREN: "60"
    FPM_START_SERVERS: "16"
    FPM_MIN_SPARE: "12"
    FPM_MAX_SPARE: "24"

db:
  type: pgsql
  host: ""
  port: "5432"
  name: moodle
  user: moodleuser
  password: ""
  sslmode: require
  readonlyHosts: []
  readonly:
    connectTimeoutSeconds: 2
    latencySeconds: 1

# PgBouncer sidecar in each web pod: app -> localhost:6432 -> managed Postgres
# When using DO managed pool (pgbouncer.enabled=false), pool size is set in Terraform (default 85).
# With sidecar: keep replicaCount × defaultPoolSize under the DB connection limit (e.g. 6×14 ≈ 84 < 97).
pgbouncer:
  enabled: true
  image: edoburu/pgbouncer:latest
  listenPort: 6432
  # DO managed Postgres defaults to SCRAM; avoid auth mismatch with md5.
  authType: scram-sha-256
  poolMode: session
  maxClientConn: 1200
  defaultPoolSize: 14
  reservePoolSize: 3
  reservePoolTimeoutSeconds: 3
  serverIdleTimeoutSeconds: 30
  queryWaitTimeoutSeconds: 120
  ignoreStartupParameters: extra_float_digits
  resources:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

# Moodle application settings (REQUIRED: wwwroot)
moodle:
  wwwroot: ""
  sslProxy: "true"
  reverseProxy: "false"

# Persistent storage for /var/www/moodledata
persistence:
  storageClass: ""
  size: 80Gi
  accessMode: ReadWriteMany

# Service configuration
service:
  type: ClusterIP
  port: 80
  annotations: {}

# Ingress configuration (disable for LoadBalancer-based setups)
ingress:
  enabled: true
  className: nginx
  host: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

# Moodle (PHP-FPM) requests/limits — favour vertical scaling on beefy nodes over many tiny pods.
# Target nodes >= 4 vCPU / 8 GiB (DO); on smaller nodes lower limits e.g. cpu=2, memory=3Gi.
resources:
  requests:
    cpu: 1000m
    memory: 1536Mi
  limits:
    cpu: 2500m
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 6
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Custom metrics via Prometheus (requires prometheus-adapter)
  customMetrics:
    enabled: false
    metricName: http_requests_per_second
    targetValue: "50"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      podValue: 3
    scaleDown:
      stabilizationWindowSeconds: 60
      podValue: 4

# Pod anti-affinity to spread across nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - moodle
          topologyKey: kubernetes.io/hostname

# HTTP probes hit the nginx container. /nginx-health is static 200; use browser/curl for real Moodle checks.
probes:
  startup:
    path: /nginx-health
    periodSeconds: 15
    failureThreshold: 40
  readiness:
    path: /nginx-health
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /nginx-health
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3

# Moodle cron (background tasks: email, cleanup, scheduled tasks)
# Runs as a separate CronJob so it doesn't compete with web pod CPU.
cron:
  enabled: true
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 900
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

cacheSetup:
  enabled: true

redis:
  enabled: true
  image: redis:7-alpine
  tcpBacklog: 1024
  timeoutSeconds: 300
  tcpKeepaliveSeconds: 60
  ioThreads: 2
  ioThreadsDoReads: true
  activeDefrag: true
  lazyfreeLazyEviction: true
  lazyfreeLazyExpire: true
  # Disable persistence for cache/session workload to reduce write overhead.
  save: ""
  appendonly: "no"
  priorityClassName: ""
  podSecurityContext:
    # Set true only when cluster policy allows this sysctl.
    enableSysctls: false
    netCoreSomaxconn: 1024
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - moodle
            topologyKey: kubernetes.io/hostname
  session:
    enabled: true
    serviceNameSuffix: redis-session
    # Session Redis should reject writes when full instead of evicting live sessions.
    maxmemory: 256mb
    maxmemoryPolicy: noeviction
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    acquireLockTimeout: 60
    lockExpire: 7200
  cache:
    enabled: true
    serviceNameSuffix: redis-cache
    # Cache Redis can evict least-frequently-used keys under pressure.
    maxmemory: 512mb
    maxmemoryPolicy: allkeys-lfu
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 800m
        memory: 1024Mi
    # These values are exported to config.php as bootstrap hints.
    # Actual MUC store mapping is handled by cache-setup hook.
    hostVarPrefix: "moodlecache_"
    database: 1
    customScriptsPath: ""

# Database backup (pg_dump via CronJob)
backup:
  enabled: false
  schedule: "0 2 * * *"
  retentionDays: 7
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 256Mi

# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

metrics:
  enabled: true

  phpFpmExporter:
    enabled: true
    image: hipages/php-fpm_exporter:2.2.0
    statusPath: /status
    pingPath: /ping
    port: 9253
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  pgbouncerExporter:
    enabled: true
    image: prometheuscommunity/pgbouncer-exporter:v0.12.0
    port: 9127
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  redisExporter:
    enabled: true
    image: oliver006/redis_exporter:v1.62.0
    port: 9121
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  # PodMonitor CRs (Prometheus Operator). Disable if you scrape only via annotations.
  podMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels:
      release: kube-prometheus-stack
