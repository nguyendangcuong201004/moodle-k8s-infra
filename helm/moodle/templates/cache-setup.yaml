{{- if and .Values.redis.enabled .Values.redis.cache.enabled .Values.cacheSetup.enabled }}
# ---------------------------------------------------------------------------
# ConfigMap: PHP script that wires Moodle MUC (APCu L1 + Redis L2, session → Redis).
# Kept as a normal release object (not a Helm hook). Moodle is installed by
# digitalocean/setup.sh *after* the first helm apply, so the script must run
# from a web pod once the DB has dbversion — see step_moodle_muc_cache_setup.
# Idempotent; safe to re-run.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moodle.fullname" . }}-cache-setup
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
data:
  setup-cache.php: |
    <?php
    /**
     * Auto-configure Moodle MUC to use a 2-tier cache:
     *   L1 = APCu (in-process, per-pod, ~0.001ms)
     *   L2 = Redis (network, shared across pods, ~0.5-1ms RTT)
     *
     * Application-mode reads hit APCu first; on miss they fall through to
     * Redis and are populated back into APCu. This dramatically cuts Redis
     * RPS for hot-static keys (lang strings, config, plugintypes, capabilities).
     *
     * Idempotent - safe to run on every deploy.
     */
    define('CLI_SCRIPT', true);

    $dirroot = '/var/www/html';
    if (!file_exists($dirroot . '/lib/setup.php')) {
        echo "[cache-setup] Moodle dirroot not ready at $dirroot.\n";
        exit(1);
    }

    // Build a minimal runtime config from env to avoid depending on any
    // placeholder config.php that may exist in the image layer.
    unset($CFG);
    global $CFG;
    $CFG = new stdClass();
    $CFG->dbtype = getenv('MOODLE_DB_TYPE') ?: 'pgsql';
    $CFG->dblibrary = 'native';
    $CFG->dbhost = getenv('MOODLE_DB_HOST');
    $CFG->dbname = getenv('MOODLE_DB_NAME') ?: 'moodle';
    $CFG->dbuser = getenv('MOODLE_DB_USER') ?: 'moodleuser';
    $CFG->dbpass = getenv('MOODLE_DB_PASSWORD') ?: '';
    $CFG->prefix = 'mdl_';
    $CFG->wwwroot = getenv('MOODLE_WWWROOT');
    $CFG->dataroot = '/var/www/moodledata';
    $CFG->localcachedir = '/tmp/moodlelocalcache';
    $CFG->directorypermissions = 0777;
    $CFG->sslproxy = (getenv('MOODLE_SSL_PROXY') === 'true');
    $CFG->dboptions = ['dbport' => getenv('MOODLE_DB_PORT') ?: '5432'];
    $_ssl = getenv('MOODLE_DB_SSLMODE');
    if ($_ssl) {
        $CFG->dboptions['sslmode'] = $_ssl;
    }
    $CFG->dirroot = $dirroot;
    $CFG->libdir = $dirroot . '/lib';

    $redisHost = getenv('MOODLE_REDIS_CACHE_HOST')
        ?: (getenv('REDIS_CACHE_HOST') ?: '');
    if (empty($redisHost)) {
        // This ConfigMap only ships when redis.cache + cacheSetup are enabled; exiting 0
        // would make setup.sh think caches were wired when they were not (e.g. runuser stripped env).
        echo "[cache-setup] MOODLE_REDIS_CACHE_HOST not set. Cannot configure Redis MUC.\n";
        exit(1);
    }

    $redisPort      = (int)(getenv('MOODLE_REDIS_CACHE_PORT') ?: 6379);
    $prefix         = getenv('MOODLE_REDIS_CACHE_PREFIX') ?: 'moodlecache_';
    $redisStoreName = 'redis_app_shared';
    $apcuStoreName  = 'local_apcu_app';
    // NOTE: Moodle 5.x cachestore_redis no longer exposes a 'database' config
    // option (see public/cache/stores/redis/addinstanceform.php). Any value
    // passed via add_store_instance() is silently dropped and the store always
    // talks to DB 0. We rely on the dedicated moodle-redis-cache Service to
    // isolate cache traffic from the moodle-redis-session Service.

    // Moodle bootstrap (sets up $DB global etc.)
    try {
        require_once($dirroot . '/lib/setup.php');
    } catch (Throwable $e) {
        echo "[cache-setup] Moodle bootstrap failed (DB/config?): " . $e->getMessage() . "\n";
        exit(1);
    }

    // Verify DB is accessible before touching cache config
    try {
        $DB->get_record('config', ['name' => 'dbversion']);
    } catch (Throwable $e) {
        echo "[cache-setup] DB not accessible: " . $e->getMessage() . "\n";
        exit(1);
    }

    try {
        $writer = cache_config_writer::instance();
        $stores = $writer->get_all_stores();
        $changed = false;

        // --- 1. Redis store (L2) ---
        if (!array_key_exists($redisStoreName, $stores)) {
            echo "[cache-setup] Adding Redis store '$redisStoreName' ($redisHost:$redisPort) ...\n";
            $ok = $writer->add_store_instance($redisStoreName, 'redis', [
                'server'     => "$redisHost:$redisPort",
                'prefix'     => $prefix,
                'password'   => '',
                'serializer' => 1, // PHP serializer
                'compressor' => 0,
            ]);
            if (!$ok) {
                echo "[cache-setup] FAILED to add Redis store (check Redis connectivity).\n";
                exit(1);
            }
            $changed = true;
            echo "[cache-setup] Redis store added.\n";
        } else {
            echo "[cache-setup] Redis store '$redisStoreName' already exists.\n";
        }

        // --- 2. APCu store (L1) — only if extension is loaded and enabled for this SAPI ---
        $iniTruthy = static function(string $directive, bool $defaultWhenEmpty): bool {
            $raw = strtolower(trim((string)ini_get($directive)));
            if ($raw === '') {
                return $defaultWhenEmpty;
            }
            if ($raw === '0' || $raw === 'off' || $raw === 'false' || $raw === 'no') {
                return false;
            }
            return ($raw === '1' || $raw === 'on' || $raw === 'true' || $raw === 'yes');
        };
        // apc.enabled defaults On for FPM; apc.enable_cli defaults Off unless explicitly enabled/mounted overlay.
        $apcuAvailable = extension_loaded('apcu')
            && function_exists('apcu_fetch')
            && (PHP_SAPI === 'cli'
                ? $iniTruthy('apc.enable_cli', false)
                : $iniTruthy('apc.enabled', true));

        if ($apcuAvailable) {
            if (!array_key_exists($apcuStoreName, $stores)) {
                echo "[cache-setup] Adding APCu store '$apcuStoreName' ...\n";
                $ok = $writer->add_store_instance($apcuStoreName, 'apcu', [
                    'prefix' => 'mdl_apcu_',
                ]);
                if (!$ok) {
                    echo "[cache-setup] WARNING: failed to add APCu store; continuing with Redis only.\n";
                } else {
                    $changed = true;
                    echo "[cache-setup] APCu store added.\n";
                }
            } else {
                echo "[cache-setup] APCu store '$apcuStoreName' already exists.\n";
            }
        } else {
            echo "[cache-setup] APCu extension not available in this CLI sandbox; will still wire web pods.\n";
        }

        // Refresh stores list after possible add_store_instance calls
        $stores = $writer->get_all_stores();

        // --- 3. Mode mapping for APPLICATION + SESSION ---
        //
        // Goal: APCu (in-process, ~0.001ms) is L1; Redis (network, ~0.5-1ms) is L2.
        // Reads hit APCu first; on miss they fall through to Redis and re-populate APCu.
        //
        // Do not map Moodle MUC session-mode caches to redis_app_shared. PHP sessions
        // already use the dedicated moodle-redis-session service via $CFG->session_*.
        // Keeping MUC session-mode on default_session makes redis-cache metrics represent
        // only the shared application L2 cache, while redis-session metrics represent sessions.
        //
        // IMPORTANT — counter-intuitive write order:
        //   * cache_config_writer::set_mode_mappings() assigns sort=0,1,2,... in INPUT order.
        //   * cache_config::load() then sorts by 'sort' DESC (see config::sort_mappings).
        //   * cache_factory::create_cache() builds the loader chain via array_pop(),
        //     wrapping the LAST popped store as the OUTERMOST (= L1, checked first).
        //
        //   Net effect: the LAST entry in our INPUT array becomes the runtime L1.
        //   So we must pass [redis, apcu] (Redis first, APCu last) to make APCu the L1.
        //   $desiredTierOrder represents the LOGICAL L1→L2 order for comparison/logging;
        //   $writeOrder is what we actually pass to set_mode_mappings().
        $desiredTierOrder = [];
        if (array_key_exists($apcuStoreName, $stores)) {
            $desiredTierOrder[] = $apcuStoreName;   // L1 — in-process APCu
        }
        if (array_key_exists($redisStoreName, $stores)) {
            $desiredTierOrder[] = $redisStoreName;  // L2 — shared Redis
        }
        $writeOrder = array_reverse($desiredTierOrder);

        $mappings    = $writer->get_mode_mappings();
        $currentApp  = [];
        foreach ($mappings as $m) {
            if ((int)$m['mode'] === cache_store::MODE_APPLICATION) {
                $currentApp[] = $m['store'];
            }
        }

        $currentSession = [];
        foreach ($mappings as $m) {
            if ((int)$m['mode'] === cache_store::MODE_SESSION) {
                $currentSession[] = $m['store'];
            }
        }

        $desiredSession = array_key_exists('default_session', $stores) ? ['default_session'] : [];

        // get_mode_mappings() returns rows in sort-DESC order, so $currentApp here
        // is already the runtime L1→L2 sequence — directly comparable to $desiredTierOrder.
        if ($currentApp !== $desiredTierOrder || $currentSession !== $desiredSession) {
            echo "[cache-setup] Mapping application-mode cache → " . implode(' (L1) → ', $desiredTierOrder) . " (L2) ...\n";
            echo "[cache-setup] Mapping session-mode cache → " . implode(' + ', $desiredSession) . " ...\n";
            // Preserve non-application/session modes and overwrite those two only.
            $newMappings = [
                cache_store::MODE_APPLICATION => $writeOrder,    // see comment above re: reversed input
                cache_store::MODE_SESSION => $desiredSession,
            ];
            foreach ($mappings as $m) {
                $mode = (int)$m['mode'];
                if ($mode === cache_store::MODE_APPLICATION || $mode === cache_store::MODE_SESSION) {
                    continue;
                }
                if (!array_key_exists($mode, $newMappings)) {
                    $newMappings[$mode] = [];
                }
                $newMappings[$mode][] = $m['store'];
            }
            $writer->set_mode_mappings($newMappings);
            $changed = true;

            // Purge so caches rebuild into the new tier order.
            cache_helper::purge_all(false);
            echo "[cache-setup] Application/session mappings updated and caches purged.\n";
        } else {
            echo "[cache-setup] Application/session mappings already correct.\n";
        }

        echo "[cache-setup] Done." . ($changed ? " (changes applied)" : " (no-op)") . "\n";
        exit(0);

    } catch (Throwable $e) {
        echo "[cache-setup] ERROR: " . $e->getMessage() . "\n";
        exit(1);
    }
{{- end }}
