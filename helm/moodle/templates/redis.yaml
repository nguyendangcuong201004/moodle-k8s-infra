{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moodle.fullname" . }}-redis
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "moodle.name" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "moodle.name" . }}-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.redis.priorityClassName }}
      priorityClassName: {{ .Values.redis.priorityClassName | quote }}
      {{- end }}
      {{- with .Values.redis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.redis.podSecurityContext.enableSysctls }}
      securityContext:
        sysctls:
          - name: net.core.somaxconn
            value: {{ .Values.redis.podSecurityContext.netCoreSomaxconn | quote }}
      {{- end }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server"]
          args:
            - "--maxmemory"
            - {{ .Values.redis.maxmemory | quote }}
            - "--maxmemory-policy"
            - {{ .Values.redis.maxmemoryPolicy | quote }}
            - "--tcp-backlog"
            - {{ .Values.redis.tcpBacklog | quote }}
            - "--timeout"
            - {{ .Values.redis.timeoutSeconds | quote }}
            - "--tcp-keepalive"
            - {{ .Values.redis.tcpKeepaliveSeconds | quote }}
            - "--activedefrag"
            - {{ ternary "yes" "no" .Values.redis.activeDefrag | quote }}
            - "--lazyfree-lazy-eviction"
            - {{ ternary "yes" "no" .Values.redis.lazyfreeLazyEviction | quote }}
            - "--lazyfree-lazy-expire"
            - {{ ternary "yes" "no" .Values.redis.lazyfreeLazyExpire | quote }}
            - "--save"
            - {{ .Values.redis.save | quote }}
            - "--appendonly"
            - {{ .Values.redis.appendonly | quote }}
            - "--io-threads"
            - {{ .Values.redis.ioThreads | quote }}
            - "--io-threads-do-reads"
            - {{ ternary "yes" "no" .Values.redis.ioThreadsDoReads | quote }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moodle.fullname" . }}-redis
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    app.kubernetes.io/name: {{ include "moodle.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
