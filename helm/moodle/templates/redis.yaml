---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moodle.fullname" . }}-{{ .Values.redis.cache.serviceNameSuffix }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-cache
spec:
