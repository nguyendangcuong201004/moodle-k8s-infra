{{- if .Values.cron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "moodle.fullname" . }}-cron
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  concurrencyPolicy: {{ default "Forbid" .Values.cron.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ default 1 .Values.cron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ default 1 .Values.cron.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ default 1 .Values.cron.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.cron.activeDeadlineSeconds }}
      {{- with .Values.cron.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "moodle.selectorLabels" . | nindent 12 }}
            role: cron
        spec:
          restartPolicy: Never
          initContainers:
            - name: copy-moodle-app
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: [sh, -c, "cp -a /var/www/html/. /moodle-html/"]
              volumeMounts:
                - name: moodle-html
                  mountPath: /moodle-html
          containers:
            - name: moodle-cron
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - bash
                - -c
                - |
                  # config.php on emptyDir — web pods keep their own /var/www/html
                  cat > /moodle-html/config.php <<'EOF'
                  <?php
                  unset($CFG); global $CFG; $CFG = new stdClass();
                  $CFG->dbtype    = getenv('MOODLE_DB_TYPE');
                  $CFG->dbhost    = getenv('MOODLE_DB_HOST');
                  $CFG->dbname    = getenv('MOODLE_DB_NAME') ?: 'moodle';
                  $CFG->dbuser    = getenv('MOODLE_DB_USER') ?: 'moodleuser';
                  $CFG->dbpass    = getenv('MOODLE_DB_PASSWORD');
                  $CFG->prefix    = 'mdl_';
                  $CFG->wwwroot   = getenv('MOODLE_WWWROOT');
                  $CFG->dataroot  = '/var/www/moodledata';
                  $CFG->directorypermissions = 0777;
                  $CFG->sslproxy        = (getenv('MOODLE_SSL_PROXY') === 'true');
                  $CFG->reverseproxy    = (getenv('MOODLE_REVERSE_PROXY') === 'true');
                  $CFG->routerconfigured = true;
                  $CFG->dboptions = ['dbport' => getenv('MOODLE_DB_PORT') ?: ''];
                  $_ssl = getenv('MOODLE_DB_SSLMODE');
                  if ($_ssl) { $CFG->dboptions['sslmode'] = $_ssl; }
                  require_once(__DIR__ . '/lib/setup.php');
                  EOF
                  cd /moodle-html
                  # During Helm deploy / version bumps, web pods may hold the upgrade lock;
                  # cron.php exits 1 with "Site is being upgraded" — retry instead of failing the Job.
                  # Keep total wait under spec.activeDeadlineSeconds (default 600s).
                  max_attempts=20
                  sleep_secs=15
                  attempt=1
                  while [ "$attempt" -le "$max_attempts" ]; do
                    out=$(runuser -u www-data -- php admin/cli/cron.php --force 2>&1)
                    rc=$?
                    echo "$out"
                    if [ "$rc" -eq 0 ]; then
                      exit 0
                    fi
                    if echo "$out" | grep -q "Site is being upgraded"; then
                      echo "moodle-cron: upgrade lock (attempt $attempt/$max_attempts), sleeping ${sleep_secs}s"
                      sleep "$sleep_secs"
                      attempt=$((attempt + 1))
                      continue
                    fi
                    exit "$rc"
                  done
                  echo "moodle-cron: gave up after $max_attempts attempts (upgrade still running?)"
                  exit 1
              env:
                - name: MOODLE_DB_TYPE
                  value: {{ .Values.db.type | quote }}
                - name: MOODLE_DB_HOST
                  value: {{ .Values.db.host | quote }}
                - name: MOODLE_DB_PORT
                  value: {{ .Values.db.port | quote }}
                - name: MOODLE_DB_NAME
                  value: {{ .Values.db.name | quote }}
                - name: MOODLE_DB_USER
                  value: {{ .Values.db.user | quote }}
                {{- if .Values.db.sslmode }}
                - name: MOODLE_DB_SSLMODE
                  value: {{ .Values.db.sslmode | quote }}
                {{- end }}
                - name: MOODLE_WWWROOT
                  value: {{ .Values.moodle.wwwroot | quote }}
                - name: MOODLE_SSL_PROXY
                  value: {{ .Values.moodle.sslProxy | quote }}
                - name: MOODLE_REVERSE_PROXY
                  value: {{ .Values.moodle.reverseProxy | quote }}
              envFrom:
                - secretRef:
                    name: {{ include "moodle.fullname" . }}-db
              volumeMounts:
                - name: moodle-html
                  mountPath: /moodle-html
                {{- if .Values.cacheSetup.apcuIniOverlay }}
                - name: php-apcu-ini
                  mountPath: /usr/local/etc/php/conf.d/zzz-moodle-k8s-apcu.ini
                  subPath: zzz-moodle-k8s-apcu.ini
                  readOnly: true
                {{- end }}
                - name: moodledata
                  mountPath: /var/www/moodledata
              resources:
                {{- toYaml .Values.cron.resources | nindent 16 }}
          volumes:
            - name: moodle-html
              emptyDir: {}
            {{- if .Values.cacheSetup.apcuIniOverlay }}
            - name: php-apcu-ini
              configMap:
                name: {{ include "moodle.fullname" . }}-php-apcu-ini
            {{- end }}
            - name: moodledata
              persistentVolumeClaim:
                claimName: {{ include "moodle.fullname" . }}-data
{{- end }}