apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moodle.fullname" . }}-nginx
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
data:
  moodle.conf: |
    server {
        listen 80;
        server_name _;
        # root = public/ so DOCUMENT_ROOT passes Moodle 4.x security check.
        # SCRIPT_FILENAME is set separately to /var/www/html so PHP-FPM can
        # reach theme/, lib/ and other files that live outside of public/.
        root /var/www/html/public;
        index index.php;

        client_max_body_size 100m;

        # Lightweight endpoint for K8s probes (avoids Moodle/DB-dependent 404s on /login/...).
        location = /nginx-health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ [^/]\.php(/|$) {
            fastcgi_split_path_info ^(.+\.php)(/.+)?$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            # Default: serve from Moodle root (covers theme/, lib/, admin/, etc.)
            set $moodle_script /var/www/html$fastcgi_script_name;
            # If the file exists in public/ (e.g. index.php), use public/ path instead.
            if (-f /var/www/html/public$fastcgi_script_name) {
                set $moodle_script /var/www/html/public$fastcgi_script_name;
            }
            fastcgi_param SCRIPT_FILENAME $moodle_script;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
        }
    }
