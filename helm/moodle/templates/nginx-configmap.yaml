apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moodle.fullname" . }}-nginx
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
data:
  moodle.conf: |
    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        client_max_body_size 100m;

        # Lightweight endpoint for K8s probes (avoids Moodle/DB-dependent 404s on /login/...).
        location = /nginx-health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Optional PATH_INFO group: /script.php without trailing path still matches (avoids FPM "Primary script unknown" → 404).
        location ~ [^/]\.php(/|$) {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)?$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
        }
    }
