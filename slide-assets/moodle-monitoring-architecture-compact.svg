<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">Moodle monitoring architecture compact</title>
  <desc id="desc">Compact monitoring architecture diagram using Grafana, Prometheus, Prometheus Operator, PodMonitor, ServiceMonitor and exporters.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; }
      .small { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .tiny { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; }
      .nsText { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #334155; }
      .ns { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 18; }
      .grafana { fill: #faf5ff; stroke: #7c3aed; stroke-width: 2.3; rx: 14; }
      .prom { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.3; rx: 14; }
      .operator { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.3; rx: 14; }
      .target { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.7; rx: 10; }
      .moodle { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.3; rx: 14; }
      .redis { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.3; rx: 14; }
      .db { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.3; rx: 14; }
      .arrowQuery { stroke: #7c3aed; stroke-width: 2.8; fill: none; marker-end: url(#arrowPurple); }
      .arrowPull { stroke: #0891b2; stroke-width: 2.8; fill: none; marker-end: url(#arrowCyan); }
      .arrowDiscover { stroke: #ca8a04; stroke-width: 2.5; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrowYellow); }
      .arrowDb { stroke: #dc2626; stroke-width: 2.5; fill: none; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>

  <rect class="bg" width="1160" height="520"/>

  <rect x="24" y="28" width="1108" height="228" class="ns"/>
  <text x="46" y="56" class="nsText">namespace: monitoring</text>

  <rect x="58" y="90" width="145" height="66" class="grafana" filter="url(#shadow)"/>
  <text x="130" y="116" text-anchor="middle" class="label">Grafana</text>
  <text x="130" y="138" text-anchor="middle" class="small">dashboards</text>

  <path class="arrowQuery" d="M203 123 H264"/>
  <text x="232" y="112" text-anchor="middle" class="tiny">PromQL</text>

  <rect x="264" y="78" width="190" height="90" class="prom" filter="url(#shadow)"/>
  <text x="359" y="108" text-anchor="middle" class="label">Prometheus</text>
  <text x="359" y="130" text-anchor="middle" class="small">time-series database</text>
  <text x="359" y="150" text-anchor="middle" class="tiny">kube-prometheus-stack</text>

  <rect x="258" y="188" width="204" height="44" class="operator" filter="url(#shadow)"/>
  <text x="360" y="207" text-anchor="middle" class="small">Prometheus Operator</text>
  <text x="360" y="224" text-anchor="middle" class="tiny">watches PodMonitor / ServiceMonitor</text>

  <rect x="520" y="54" width="188" height="48" class="target" filter="url(#shadow)"/>
  <text x="614" y="75" text-anchor="middle" class="label">kube-state-metrics</text>
  <text x="614" y="93" text-anchor="middle" class="tiny">Kubernetes object state</text>

  <rect x="520" y="116" width="188" height="48" class="target" filter="url(#shadow)"/>
  <text x="614" y="137" text-anchor="middle" class="label">node-exporter</text>
  <text x="614" y="155" text-anchor="middle" class="tiny">node resource metrics</text>

  <rect x="758" y="56" width="196" height="60" class="target" filter="url(#shadow)"/>
  <text x="856" y="79" text-anchor="middle" class="label">postgres-exporter</text>
  <text x="856" y="99" text-anchor="middle" class="tiny">ServiceMonitor, port 9187</text>

  <rect x="758" y="146" width="196" height="48" class="target" filter="url(#shadow)"/>
  <text x="856" y="167" text-anchor="middle" class="small">postgres-exporter-standby</text>
  <text x="856" y="185" text-anchor="middle" class="tiny">optional, port 9188</text>

  <rect x="990" y="88" width="98" height="92" class="db" filter="url(#shadow)"/>
  <text x="1039" y="118" text-anchor="middle" class="small">DO Managed</text>
  <text x="1039" y="139" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1039" y="160" text-anchor="middle" class="tiny">SSL</text>

  <path class="arrowPull" d="M454 98 C480 98 488 78 520 78"/>
  <path class="arrowPull" d="M454 124 C482 124 488 140 520 140"/>
  <path class="arrowPull" d="M454 168 C570 238 720 196 758 136"/>
  <path class="arrowDb" d="M954 86 H990"/>
  <path class="arrowDb" d="M856 146 C900 138 950 150 990 150"/>

  <rect x="24" y="286" width="1108" height="226" class="ns"/>
  <text x="46" y="314" class="nsText">namespace: moodle</text>

  <rect x="64" y="348" width="322" height="112" class="moodle" filter="url(#shadow)"/>
  <text x="225" y="374" text-anchor="middle" class="label">Moodle web Pod replicas</text>
  <text x="225" y="395" text-anchor="middle" class="small">nginx + php-fpm + pgbouncer</text>
  <rect x="86" y="414" width="132" height="34" class="target"/>
  <text x="152" y="435" text-anchor="middle" class="tiny">php-fpm-exporter :9253</text>
  <rect x="230" y="414" width="132" height="34" class="target"/>
  <text x="296" y="435" text-anchor="middle" class="tiny">pgbouncer-exporter :9127</text>

  <rect x="442" y="332" width="222" height="68" class="redis" filter="url(#shadow)"/>
  <text x="553" y="358" text-anchor="middle" class="label">Redis session Pod</text>
  <text x="553" y="380" text-anchor="middle" class="small">redis-exporter :9121</text>

  <rect x="442" y="426" width="222" height="68" class="redis" filter="url(#shadow)"/>
  <text x="553" y="452" text-anchor="middle" class="label">Redis cache Pod</text>
  <text x="553" y="474" text-anchor="middle" class="small">redis-exporter :9121</text>

  <rect x="742" y="356" width="234" height="86" class="operator" filter="url(#shadow)"/>
  <text x="859" y="384" text-anchor="middle" class="label">PodMonitor</text>
  <text x="859" y="407" text-anchor="middle" class="small">scrape interval: 30s</text>
  <text x="859" y="426" text-anchor="middle" class="tiny">selects Moodle + Redis exporters</text>

  <path class="arrowDiscover" d="M462 210 C660 210 838 258 859 356"/>
  <path class="arrowPull" d="M330 168 C312 242 244 282 225 348"/>
  <path class="arrowPull" d="M366 168 C470 214 548 266 553 332"/>
  <path class="arrowPull" d="M394 168 C530 248 558 344 553 426"/>
  <text x="520" y="275" text-anchor="middle" class="tiny">Prometheus scrapes exporter /metrics endpoints</text>

  <text x="578" y="502" text-anchor="middle" class="small">Exporters expose /metrics; Prometheus scrapes discovered targets; Grafana visualizes Prometheus data through PromQL.</text>
</svg>
