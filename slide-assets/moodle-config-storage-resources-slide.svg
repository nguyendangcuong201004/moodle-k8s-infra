<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Config and storage resources</title>
  <desc id="desc">One-slide diagram of the current Moodle configuration and storage resources: web pods mount a Longhorn RWX PVC for moodledata, pod-local runtime data stays ephemeral, configuration is provided by ConfigMaps, secrets hold sensitive data, and PostgreSQL is a separate DigitalOcean Managed Database.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 46px; font-weight: 900; fill: #0f2d8f; }
      .subtitle { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #64748b; }
      .section { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 14px; font-weight: 900; fill: #334155; letter-spacing: .5px; }
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 20px; font-weight: 900; fill: #0f172a; }
      .small { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #475569; }
      .tiny { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #64748b; }
      .bulletTitle { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 20px; font-weight: 900; fill: #0f172a; }
      .bullet { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #334155; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 22; }
      .pod { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.6; rx: 16; }
      .pvc { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.8; rx: 16; }
      .sc { fill: #fff7ed; stroke: #f97316; stroke-width: 2.8; rx: 16; }
      .lh { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.6; rx: 16; }
      .share { fill: #faf5ff; stroke: #7c3aed; stroke-width: 2.6; rx: 16; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 2.2; rx: 14; }
      .replica { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.1; rx: 10; }
      .db { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; rx: 16; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .cardGreen { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.2; rx: 18; }
      .cardBlue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 18; }
      .cardPink { fill: #fdf2f8; stroke: #db2777; stroke-width: 2.2; rx: 18; }
      .cardRed { fill: #fff1f2; stroke: #dc2626; stroke-width: 2.2; rx: 18; }
      .pill { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.6; rx: 14; }
      .arrowGreen { stroke: #16a34a; stroke-width: 3.4; fill: none; marker-end: url(#arrowGreen); }
      .arrowOrange { stroke: #f97316; stroke-width: 3.4; fill: none; marker-end: url(#arrowOrange); }
      .arrowCyan { stroke: #0891b2; stroke-width: 3.2; fill: none; marker-end: url(#arrowCyan); }
      .arrowPurple { stroke: #7c3aed; stroke-width: 3.2; fill: none; marker-end: url(#arrowPurple); }
      .dash { stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrowSlate); }
    </style>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.11"/></filter>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="92" y="92" class="title">Config &amp; Storage Resources</text>
  <text x="94" y="125" class="subtitle">Current implementation: Moodle shared files on Longhorn, configuration through Kubernetes primitives</text>

  <rect x="72" y="158" width="960" height="750" class="panel"/>
  <text x="102" y="195" class="section">SHARED FILE STORAGE PATH</text>

  <rect x="122" y="238" width="190" height="76" class="pod" filter="url(#shadow)"/>
  <text x="217" y="267" text-anchor="middle" class="label">Web Pod</text>
  <text x="217" y="292" text-anchor="middle" class="small">moodledata mount</text>

  <rect x="374" y="238" width="190" height="76" class="pod" filter="url(#shadow)"/>
  <text x="469" y="267" text-anchor="middle" class="label">Web Pod</text>
  <text x="469" y="292" text-anchor="middle" class="small">moodledata mount</text>

  <rect x="626" y="238" width="190" height="76" class="pod" filter="url(#shadow)"/>
  <text x="721" y="267" text-anchor="middle" class="label">Web Pod</text>
  <text x="721" y="292" text-anchor="middle" class="small">moodledata mount</text>

  <path class="arrowGreen" d="M217 314 V358 H469 V392"/>
  <path class="arrowGreen" d="M469 314 V392"/>
  <path class="arrowGreen" d="M721 314 V358 H469 V392"/>

  <rect x="270" y="392" width="308" height="72" class="pvc" filter="url(#shadow)"/>
  <text x="424" y="421" text-anchor="middle" class="label">PVC: moodle-data</text>
  <text x="424" y="446" text-anchor="middle" class="small">ReadWriteMany, /var/www/moodledata</text>

  <path class="arrowOrange" d="M578 428 H642"/>

  <rect x="642" y="392" width="286" height="72" class="sc" filter="url(#shadow)"/>
  <text x="785" y="421" text-anchor="middle" class="label">StorageClass</text>
  <text x="785" y="446" text-anchor="middle" class="small">longhorn / longhorn-staging-r1</text>

  <path class="arrowOrange" d="M785 464 V528 H262 V552"/>

  <rect x="122" y="552" width="280" height="82" class="lh" filter="url(#shadow)"/>
  <text x="262" y="584" text-anchor="middle" class="label">Longhorn CSI</text>
  <text x="262" y="610" text-anchor="middle" class="small">dynamic PV provisioning</text>

  <path class="arrowCyan" d="M402 593 H478"/>

  <rect x="478" y="542" width="306" height="102" class="share" filter="url(#shadow)"/>
  <text x="631" y="576" text-anchor="middle" class="label">RWX Share Manager</text>
  <text x="631" y="603" text-anchor="middle" class="small">NFSv4 export inside cluster</text>
  <text x="631" y="626" text-anchor="middle" class="tiny">created for an active RWX volume</text>

  <path class="arrowPurple" d="M631 644 V684"/>

  <rect x="178" y="684" width="680" height="150" class="node" filter="url(#shadow)"/>
  <text x="518" y="724" text-anchor="middle" class="label">Longhorn Volume Replicas</text>
  <rect x="248" y="758" width="130" height="50" class="replica"/>
  <text x="313" y="790" text-anchor="middle" class="small">Worker Node</text>
  <rect x="453" y="758" width="130" height="50" class="replica"/>
  <text x="518" y="790" text-anchor="middle" class="small">Worker Node</text>
  <rect x="658" y="758" width="130" height="50" class="replica"/>
  <text x="723" y="790" text-anchor="middle" class="small">Worker Node</text>
  <text x="518" y="822" text-anchor="middle" class="tiny">replica count is StorageClass-driven</text>

  <rect x="1060" y="158" width="470" height="750" class="panel"/>
  <text x="1090" y="195" class="section">RESOURCE PLACEMENT</text>

  <rect x="1092" y="232" width="404" height="116" class="cardGreen" filter="url(#shadow)"/>
  <text x="1120" y="267" class="bulletTitle">Longhorn RWX PVC</text>
  <text x="1120" y="299" class="bullet">• Shared Moodle files and uploads</text>
  <text x="1120" y="329" class="bullet">• Mounted at /var/www/moodledata</text>

  <rect x="1092" y="378" width="404" height="146" class="cardBlue" filter="url(#shadow)"/>
  <text x="1120" y="413" class="bulletTitle">Pod-local runtime</text>
  <text x="1120" y="445" class="bullet">• Moodle app copy on emptyDir</text>
  <text x="1120" y="475" class="bullet">• /tmp/moodlelocalcache</text>
  <text x="1120" y="505" class="bullet">• OPcache and APCu in memory</text>

  <rect x="1092" y="554" width="404" height="132" class="cardPink" filter="url(#shadow)"/>
  <text x="1120" y="589" class="bulletTitle">ConfigMap / Secret</text>
  <text x="1120" y="621" class="bullet">• ConfigMap: NGINX and cache setup</text>
  <text x="1120" y="651" class="bullet">• Secret: database password</text>

  <rect x="1092" y="716" width="404" height="96" class="cardRed" filter="url(#shadow)"/>
  <text x="1120" y="751" class="bulletTitle">Database is separate</text>
  <text x="1120" y="783" class="bullet">• DigitalOcean Managed PostgreSQL</text>

  <rect x="1092" y="835" width="404" height="36" class="pill"/>
  <text x="1294" y="858" text-anchor="middle" class="tiny">Longhorn stores shared files, not PostgreSQL data.</text>
</svg>
