<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Infrastructure cost and platform choice summary</title>
  <desc id="desc">A concise slide table summarizing the current Moodle infrastructure monthly cost on DigitalOcean Kubernetes and the main platform selection trade-offs.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 46px; font-weight: 900; fill: #0f2d8f; }
      .subtitle { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #64748b; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2.2; rx: 22; }
      .header { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
      .sectionCost { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; }
      .sectionTrade { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; }
      .total { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.4; }
      .cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; }
      .cellSoft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.6; }
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 20px; font-weight: 900; fill: #0f172a; }
      .small { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #334155; }
      .tiny { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #64748b; }
      .white { fill: #ffffff; }
      .blue { fill: #0f2d8f; }
      .green { fill: #166534; }
      .orange { fill: #9a3412; }
      .muted { fill: #64748b; }
      .pill { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; rx: 18; }
      .pillGreen { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; rx: 18; }
      .pillOrange { fill: #ffedd5; stroke: #f97316; stroke-width: 1.8; rx: 18; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="90" y="92" class="title">Infrastructure Cost &amp; Platform Choice</text>
  <text x="92" y="126" class="subtitle">Baseline: production DigitalOcean Kubernetes configuration from Terraform and Helm</text>

  <rect x="72" y="158" width="1456" height="704" class="panel"/>

  <rect x="112" y="198" width="1336" height="64" class="header"/>
  <text x="150" y="238" class="label white">Area</text>
  <text x="430" y="238" class="label white">Current project configuration</text>
  <text x="900" y="238" class="label white">Estimated monthly cost</text>
  <text x="1170" y="238" class="label white">Decision note</text>

  <rect x="112" y="262" width="1336" height="48" class="sectionCost"/>
  <text x="150" y="294" class="small green">Cost baseline</text>
  <text x="430" y="294" class="tiny green">Prices are estimates and can vary by region, billing period, optional features, and taxes.</text>

  <rect x="112" y="310" width="280" height="66" class="cellSoft"/>
  <rect x="392" y="310" width="470" height="66" class="cell"/>
  <rect x="862" y="310" width="270" height="66" class="cell"/>
  <rect x="1132" y="310" width="316" height="66" class="cell"/>
  <text x="150" y="350" class="small">Kubernetes control plane</text>
  <text x="430" y="337" class="small">DOKS Standard cluster</text>
  <text x="430" y="360" class="tiny">HA control plane is optional</text>
  <text x="900" y="350" class="small green">$0</text>
  <text x="1170" y="350" class="small">Managed K8s, no cluster fee</text>

  <rect x="112" y="376" width="280" height="76" class="cellSoft"/>
  <rect x="392" y="376" width="470" height="76" class="cell"/>
  <rect x="862" y="376" width="270" height="76" class="cell"/>
  <rect x="1132" y="376" width="316" height="76" class="cell"/>
  <text x="150" y="421" class="small">Worker nodes</text>
  <text x="430" y="405" class="small">3 to 6 nodes</text>
  <text x="430" y="428" class="tiny">s-4vcpu-8gb, $48 each</text>
  <text x="900" y="421" class="small green">$144-$288</text>
  <text x="1170" y="405" class="small">Autoscale capacity for load tests</text>
  <text x="1170" y="428" class="tiny">production keeps 3 min / 6 max</text>

  <rect x="112" y="452" width="280" height="76" class="cellSoft"/>
  <rect x="392" y="452" width="470" height="76" class="cell"/>
  <rect x="862" y="452" width="270" height="76" class="cell"/>
  <rect x="1132" y="452" width="316" height="76" class="cell"/>
  <text x="150" y="497" class="small">Managed PostgreSQL</text>
  <text x="430" y="481" class="small">2 nodes: primary + standby</text>
  <text x="430" y="504" class="tiny">db-s-2vcpu-4gb, 60 GiB</text>
  <text x="900" y="497" class="small green">about $122</text>
  <text x="1170" y="481" class="small">Managed DB reduces ops risk</text>
  <text x="1170" y="504" class="tiny">connection pooling via PgBouncer</text>

  <rect x="112" y="528" width="280" height="66" class="cellSoft"/>
  <rect x="392" y="528" width="470" height="66" class="cell"/>
  <rect x="862" y="528" width="270" height="66" class="cell"/>
  <rect x="1132" y="528" width="316" height="66" class="cell"/>
  <text x="150" y="568" class="small">Load balancer</text>
  <text x="430" y="568" class="small">DigitalOcean Load Balancer</text>
  <text x="900" y="568" class="small green">about $12</text>
  <text x="1170" y="568" class="small">Public entry to NGINX Ingress</text>

  <rect x="112" y="594" width="280" height="78" class="total"/>
  <rect x="392" y="594" width="470" height="78" class="total"/>
  <rect x="862" y="594" width="270" height="78" class="total"/>
  <rect x="1132" y="594" width="316" height="78" class="total"/>
  <text x="150" y="641" class="label green">Estimated total</text>
  <text x="430" y="627" class="small green">Production baseline only</text>
  <text x="430" y="651" class="tiny green">excludes staging, overage bandwidth, backups, domain, taxes</text>
  <text x="900" y="641" class="label green">about $278-$422</text>
  <text x="1170" y="641" class="small green">Cost scales mainly with node count</text>

  <rect x="112" y="694" width="1336" height="48" class="sectionTrade"/>
  <text x="150" y="726" class="small orange">Platform trade-off</text>
  <text x="430" y="726" class="tiny orange">This is why the project uses Kubernetes instead of a single managed app platform.</text>

  <rect x="112" y="742" width="448" height="86" class="cell"/>
  <rect x="560" y="742" width="448" height="86" class="cell"/>
  <rect x="1008" y="742" width="440" height="86" class="cell"/>

  <rect x="142" y="766" width="160" height="34" class="pillGreen"/>
  <text x="222" y="789" text-anchor="middle" class="tiny green">Low lock-in</text>
  <text x="320" y="778" class="tiny">Kubernetes manifests and Helm chart</text>
  <text x="320" y="802" class="tiny">remain portable across clouds.</text>

  <rect x="590" y="766" width="180" height="34" class="pillOrange"/>
  <text x="680" y="789" text-anchor="middle" class="tiny orange">Higher overhead</text>
  <text x="790" y="778" class="tiny">Requires cluster, storage, ingress,</text>
  <text x="790" y="802" class="tiny">monitoring and rollout operations.</text>

  <rect x="1038" y="766" width="180" height="34" class="pill"/>
  <text x="1128" y="789" text-anchor="middle" class="tiny blue">High control</text>
  <text x="1238" y="778" class="tiny">Fits autoscaling, stress tests,</text>
  <text x="1238" y="802" class="tiny">PgBouncer, Longhorn and observability.</text>

  <text x="112" y="856" class="tiny muted">Calculation uses 730-hour monthly estimates where applicable. Numbers should be rechecked before final submission because provider pricing can change.</text>
</svg>
