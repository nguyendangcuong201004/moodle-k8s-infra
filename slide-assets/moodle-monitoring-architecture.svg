<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Moodle observability architecture</title>
  <desc id="desc">Monitoring architecture for Moodle on Kubernetes using kube-prometheus-stack, Prometheus Operator, PodMonitor, ServiceMonitor, exporters, Prometheus, and Grafana dashboards.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #0f2d8f; }
      .subtitle { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #0f172a; }
      .small { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .tiny { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; }
      .ns { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 22; }
      .monitoring { fill: #fff7ed; stroke: #f97316; stroke-width: 2.4; rx: 18; }
      .moodle { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.4; rx: 18; }
      .prom { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.4; rx: 16; }
      .grafana { fill: #faf5ff; stroke: #7c3aed; stroke-width: 2.4; rx: 16; }
      .operator { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.4; rx: 16; }
      .target { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.8; rx: 12; }
      .db { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.4; rx: 16; }
      .note { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 14; }
      .arrowPull { stroke: #0891b2; stroke-width: 2.8; fill: none; marker-end: url(#arrowCyan); }
      .arrowQuery { stroke: #7c3aed; stroke-width: 2.8; fill: none; marker-end: url(#arrowPurple); }
      .arrowDiscover { stroke: #ca8a04; stroke-width: 2.6; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrowYellow); }
      .arrowDb { stroke: #dc2626; stroke-width: 2.6; fill: none; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text x="48" y="58" class="title">Moodle Metrics and Monitoring Architecture</text>
  <text x="50" y="88" class="subtitle">Current Prometheus-based observability flow for production Moodle on Kubernetes</text>

  <!-- User/Grafana access -->
  <rect x="50" y="126" width="202" height="76" class="grafana" filter="url(#shadow)"/>
  <text x="151" y="154" text-anchor="middle" class="label">Administrator</text>
  <text x="151" y="178" text-anchor="middle" class="small">views dashboards</text>

  <path class="arrowQuery" d="M252 164 H310"/>

  <!-- Monitoring namespace -->
  <rect x="310" y="116" width="842" height="312" class="ns"/>
  <text x="334" y="148" class="label">namespace: monitoring</text>

  <rect x="350" y="178" width="190" height="82" class="grafana" filter="url(#shadow)"/>
  <text x="445" y="209" text-anchor="middle" class="label">Grafana</text>
  <text x="445" y="232" text-anchor="middle" class="small">dashboards + panels</text>

  <path class="arrowQuery" d="M540 219 H604"/>
  <text x="572" y="208" text-anchor="middle" class="tiny">PromQL</text>

  <rect x="604" y="174" width="226" height="90" class="prom" filter="url(#shadow)"/>
  <text x="717" y="204" text-anchor="middle" class="label">Prometheus</text>
  <text x="717" y="227" text-anchor="middle" class="small">time-series database</text>
  <text x="717" y="248" text-anchor="middle" class="tiny">kube-prometheus-stack</text>

  <rect x="350" y="304" width="250" height="74" class="operator" filter="url(#shadow)"/>
  <text x="475" y="331" text-anchor="middle" class="label">Prometheus Operator</text>
  <text x="475" y="354" text-anchor="middle" class="small">watches PodMonitor / ServiceMonitor</text>

  <path class="arrowDiscover" d="M600 341 C658 341 658 270 704 264"/>
  <text x="650" y="326" text-anchor="middle" class="tiny">target discovery</text>

  <rect x="866" y="144" width="240" height="52" class="target" filter="url(#shadow)"/>
  <text x="986" y="166" text-anchor="middle" class="label">kube-state-metrics</text>
  <text x="986" y="185" text-anchor="middle" class="tiny">Kubernetes object state</text>

  <rect x="866" y="212" width="240" height="52" class="target" filter="url(#shadow)"/>
  <text x="986" y="234" text-anchor="middle" class="label">node-exporter</text>
  <text x="986" y="253" text-anchor="middle" class="tiny">node CPU / memory / disk</text>

  <rect x="866" y="280" width="240" height="62" class="target" filter="url(#shadow)"/>
  <text x="986" y="302" text-anchor="middle" class="label">postgres-exporter</text>
  <text x="986" y="322" text-anchor="middle" class="tiny">ServiceMonitor, port 9187</text>

  <rect x="866" y="356" width="240" height="42" class="target" filter="url(#shadow)"/>
  <text x="986" y="382" text-anchor="middle" class="small">postgres-exporter-standby optional</text>

  <path class="arrowPull" d="M830 198 C850 198 850 170 866 170"/>
  <path class="arrowPull" d="M830 218 C850 218 850 238 866 238"/>
  <path class="arrowPull" d="M830 238 C850 238 850 311 866 311"/>
  <text x="840" y="190" text-anchor="middle" class="tiny">scrape</text>

  <!-- DB outside -->
  <rect x="930" y="462" width="192" height="82" class="db" filter="url(#shadow)"/>
  <text x="1026" y="492" text-anchor="middle" class="label">DO Managed</text>
  <text x="1026" y="515" text-anchor="middle" class="small">PostgreSQL</text>
  <text x="1026" y="535" text-anchor="middle" class="tiny">SSL connection</text>
  <path class="arrowDb" d="M986 342 V462"/>

  <!-- Moodle namespace -->
  <rect x="50" y="464" width="842" height="240" class="ns"/>
  <text x="74" y="496" class="label">namespace: moodle</text>

  <rect x="92" y="532" width="310" height="126" class="moodle" filter="url(#shadow)"/>
  <text x="247" y="558" text-anchor="middle" class="label">Moodle web Pod replicas</text>
  <text x="247" y="580" text-anchor="middle" class="small">nginx + php-fpm + pgbouncer</text>
  <rect x="110" y="604" width="130" height="36" class="target"/>
  <text x="175" y="627" text-anchor="middle" class="tiny">php-fpm-exporter :9253</text>
  <rect x="254" y="604" width="130" height="36" class="target"/>
  <text x="319" y="627" text-anchor="middle" class="tiny">pgbouncer-exporter :9127</text>

  <rect x="444" y="524" width="230" height="66" class="moodle" filter="url(#shadow)"/>
  <text x="559" y="550" text-anchor="middle" class="label">Redis session Pod</text>
  <text x="559" y="572" text-anchor="middle" class="small">redis-exporter :9121</text>

  <rect x="444" y="612" width="230" height="66" class="moodle" filter="url(#shadow)"/>
  <text x="559" y="638" text-anchor="middle" class="label">Redis cache Pod</text>
  <text x="559" y="660" text-anchor="middle" class="small">redis-exporter :9121</text>

  <rect x="716" y="552" width="230" height="82" class="operator" filter="url(#shadow)"/>
  <text x="831" y="582" text-anchor="middle" class="label">PodMonitor</text>
  <text x="831" y="605" text-anchor="middle" class="small">interval: 30s</text>
  <text x="831" y="625" text-anchor="middle" class="tiny">selects Moodle + Redis exporters</text>

  <path class="arrowDiscover" d="M831 552 C831 474 555 438 475 378"/>
  <path class="arrowPull" d="M704 264 C704 452 247 452 247 532"/>
  <path class="arrowPull" d="M730 264 C730 446 559 446 559 524"/>
  <path class="arrowPull" d="M756 264 C756 470 559 470 559 612"/>
  <text x="698" y="454" text-anchor="middle" class="tiny">Prometheus scrapes /metrics</text>

  <rect x="50" y="718" width="1102" height="40" class="note"/>
  <text x="601" y="743" text-anchor="middle" class="small">Key point: exporters expose /metrics; Prometheus scrapes targets discovered by PodMonitor/ServiceMonitor; Grafana visualizes Prometheus data with PromQL.</text>
</svg>
